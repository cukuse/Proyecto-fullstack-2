<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login :D</title>
    <link rel="stylesheet" href="css/estilo-login.css">
</head>
<body>
    <header class="cabecilla-login">
        <div class="icono-login"><a href="index.html"><img src="img/icono-login.svg" alt="Logotipo del sitio"></a></div>
        
    </header>
    <main>
        <section>
            <div>
                <!-- Reemplaza solo la parte del <form> en tu login.html -->
                <form class="login-from" id="form-login">
                    <!-- Campo de correo -->
                    <input type="text" id="usuario-email" class="box" placeholder="Correo o Nombre De Usuario">
                    <!-- Párrafo vacío oculto donde JS escribirá el error si el correo está mal -->
                    <p class="mensaje-error" id="error-email"></p>

                    <!-- Campo de contraseña -->
                    <input type="password" id="usuario-pass" class="box" placeholder="Contraseña">
                    <!-- Párrafo vacío oculto para el error de la contraseña -->
                    <p class="mensaje-error" id="error-pass"></p>

                    <div><button type="submit" id="btn-usuario">Iniciar Sesion</button></div>
                    <a href="" class="l-contraseña">¿Olvidaste Tu Contraseña?</a>
                </form>

<!-- ESTO VA AL FINAL DEL BODY: Conecta tu archivo de JavaScript -->
<script src="jss/validaciones.js"></script>
            </div>
        </section>
    </main>
    <footer>
        <div>
            <section><button class="btn-crear-cuenta" onclick="">Crear Cuenta Nueva</button></section>
        </div>
    </footer>
</body>
</html>

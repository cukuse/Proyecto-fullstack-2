<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos - Tu Día Especial</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/formularios-extra.css">
</head>
<body>
    <header class="inicio-cabecilla">
        <div class="icono-buscar"><img src="img/icono-buscar.png" alt="Buscar"></div>
        <div class="logo"><a href="index.html"><img src="img/logo2.png" alt="Logo"></a></div>
        <div class="icono-usuario"><a href="login.html"><img src="img/icono-usuario.png" alt="Usuario"></a></div>
    </header>
    
    <main class="main-centrado">
        <h2 class="titulo-seccion">Envíanos un Mensaje</h2>
        <p class="subtitulo-seccion">¿Tienes dudas sobre un evento? Escríbenos.</p>
        
        <form class="caja-formulario" action="#" method="POST" id="form-contacto">
            <div class="grupo-input">
                <label>Nombre Completo</label>
                <input id="contacto-nombre"  type="text" placeholder="Ej: Juan Pérez" required>
                <p class="mensaje-error" id="error-nombre"></p>
            </div>
            <div class="grupo-input">
                <label>Correo Electrónico</label>
                <input type="email" placeholder="tu@correo.com" required>
            </div>
            <div class="grupo-input">
                <label>Asunto</label>
                <select class="input-select">
                    <option>Cotización</option>
                    <option>Reclamo</option>
                    <option>Trabaja con nosotros</option>
                </select>
            </div>
            <div class="grupo-input">
                <label>Mensaje</label>
                <textarea id="contacto-mensaje" rows="4" placeholder="Escribe tu consulta aquí..." required></textarea>
                <p class="mensaje-error" id="error-mensaje"></p>
            </div>
            <button type="submit" class="btn-accion">Enviar Mensaje</button>
        </form>
    </main>
    <footer>
        <div class="redes-sociales">
            <a href="#"><p>📷 @diasespecial</p></a>
            <p>📘 @diasespecial</p>
        </div>
        <div class="info-pag">
            <p>Copyright Tu Día Feliz - 2026. Todos los derechos reservados</p>
            <p>Defensa de las y los consumidores. Para reclamos ingresa aquí</p>
            <p>Botón de arrepentimiento</p>
        </div>
    </footer>
</body>
</html>

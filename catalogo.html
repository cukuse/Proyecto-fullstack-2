<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Tu Día Especial</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/catalogo.css">
</head>
<body>
    <header class="inicio-cabecilla">
        <div class="icono-buscar"><img src="img/icono-buscar.png" alt="Buscar"></div>
        <div class="logo"><a href="index.html"><img src="img/logo2.png" alt="Logo"></a></div>
        <div class="icono-usuario"><a href="login.html"><img src="img/icono-usuario.png" alt="Usuario"></a></div>
    </header>

    <main class="main-catalogo">
        <h2 class="titulo-seccion">Nuestros Eventos</h2>
        
        <!-- Formulario de filtro -->
        <form class="barra-filtros">
            <input type="text" placeholder="Buscar evento..." class="input-buscar">
            <label><input type="checkbox"> Matrimonios</label>
            <label><input type="checkbox"> Cumpleaños</label>
            <button type="button" class="btn-filtro">Filtrar</button>
        </form>

        <div class="grilla-catalogo">
    <!-- Tarjeta 1 -->
    <div class="tarjeta-evento">
        <div class="imagen-placeholder">
            <img src="img/boda-catalgo.jpg" alt="Boda al aire libre">
        </div>
        <h3>Boda al aire libre</h3>
        <p>Aforo: 50 personas</p>
    </div>
    
    <!-- Tarjeta 2 -->
    <div class="tarjeta-evento">
        <div class="imagen-placeholder">
            <img src="img/cumple-catalogo.jpg" alt="Cumpleaños Temático">
        </div>
        <h3>Cumpleaños Temático</h3>
        <p>Aforo: 30 personas</p>
    </div>
</div>
    <footer>
        <div class="redes-sociales">
            <a href="#"><p>📷 @diasespecial</p></a>
            <p>📘 @diasespecial</p>
        </div>
        <div class="info-pag">
            <p>Copyright Tu Día Feliz - 2026. Todos los derechos reservados</p>
            <p>Defensa de las y los consumidores. Para reclamos ingresa aquí</p>
            <p>Botón de arrepentimiento</p>
        </div>
    </footer>
</body>
</html>

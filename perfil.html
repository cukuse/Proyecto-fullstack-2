<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Tu Día Especial</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/formularios-extra.css">
</head>
<body>
    <header class="inicio-cabecilla">
        <div class="icono-buscar"><img src="img/icono-buscar.png" alt="Buscar"></div>
        <div class="logo"><a href="index.html"><img src="img/logo2.png" alt="Logo"></a></div>
        <div class="icono-usuario"><a href="login.html"><img src="img/icono-usuario.png" alt="Usuario"></a></div>
    </header>

    <main class="main-centrado">
        <div class="avatar-perfil">
            <img src="img/icono-usuario.png" alt="Mi Perfil">
        </div>
        <h2 class="titulo-seccion">Mis Datos Personales</h2>
        
        <form class="caja-formulario" action="#" method="POST">
            <div class="grupo-input">
                <label>Cambiar Nombre de Usuario</label>
                <input type="text" value="Usuario123">
            </div>
            <div class="grupo-input">
                <label>Teléfono de Contacto</label>
                <input type="tel" value="+56 9 1234 5678">
            </div>
            <div class="grupo-input">
                <label>Nueva Contraseña</label>
                <input type="password" placeholder="********">
            </div>
            <button type="submit" class="btn-accion">Guardar Cambios</button>
        </form>
    </main>
    <footer>
        <div class="redes-sociales">
            <a href="#"><p>📷 @diasespecial</p></a>
            <p>📘 @diasespecial</p>
        </div>
        <div class="info-pag">
            <p>Copyright Tu Día Feliz - 2026. Todos los derechos reservados</p>
            <p>Defensa de las y los consumidores. Para reclamos ingresa aquí</p>
            <p>Botón de arrepentimiento</p>
        </div>
    </footer>
    
</body>
</html>
